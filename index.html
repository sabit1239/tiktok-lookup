<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Info Lookup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
    --accent:#fe2c55;--accent2:#25f4ee;
    --text:#e8e8f0;--muted:#7070a0;--card:#16161f;
  }
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 16px 60px}

  header{text-align:center;padding:48px 0 32px}
  .logo{width:44px;height:44px;background:var(--accent);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
  header h1{font-size:clamp(24px,6vw,38px);font-weight:700;letter-spacing:-.03em}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);font-size:14px;margin-top:8px}

  .wrap{max-width:460px;margin:0 auto}

  .search-box{display:flex;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s;margin-bottom:10px}
  .search-box:focus-within{border-color:var(--accent)}
  .at{padding:0 14px;color:var(--muted);font-size:18px;display:flex;align-items:center;border-right:1.5px solid var(--border)}
  input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:16px;padding:15px 14px}
  input::placeholder{color:var(--muted)}
  button#go{background:var(--accent);border:none;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;padding:0 22px;cursor:pointer;transition:opacity .15s}
  button#go:hover{opacity:.85}
  button#go:disabled{opacity:.5;cursor:not-allowed}

  #msg{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
  #msg.err{color:var(--accent)}

  #result{display:none;margin-top:20px}

  .card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px}

  .profile-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .av{position:relative;flex-shrink:0}
  .av img,.av-fb{width:68px;height:68px;border-radius:50%;border:2.5px solid var(--accent);object-fit:cover;display:block}
  .av-fb{background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff}
  .lock{position:absolute;bottom:0;right:0;background:#ffd700;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--card)}

  .pname{flex:1;min-width:0}
  .pname .dn{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pname .handle{color:var(--muted);font-size:13px;margin-top:2px}
  .open-btn{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;text-decoration:none;margin-top:7px;transition:opacity .15s}
  .open-btn:hover{opacity:.85}

  .bio{color:#c0c0d8;font-size:13px;line-height:1.6;padding-top:12px;border-top:1px solid var(--border);white-space:pre-wrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center}
  .stat .v{font-size:17px;font-weight:700;color:var(--accent2)}
  .stat .l{font-size:11px;color:var(--muted);margin-top:4px}

  .info-list{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);gap:10px}
  .row:last-child{border-bottom:none}
  .rk{color:var(--muted);font-weight:500;flex-shrink:0}
  .rv{color:var(--text);text-align:right;word-break:break-all;font-size:12px}
  .cp{background:var(--border);border:none;color:var(--muted);font-size:11px;padding:4px 8px;border-radius:6px;cursor:pointer;flex-shrink:0;transition:all .15s}
  .cp:hover{background:var(--accent);color:#fff}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:5px}
  @keyframes sp{to{transform:rotate(360deg)}}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:48px}
  footer span{color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="logo">♟</div>
  <h1>TikTok <span>Info</span> Lookup</h1>
  <p>Public profile details of any TikTok account</p>
</header>

<div class="wrap">
  <div class="search-box">
    <span class="at">@</span>
    <input id="q" type="text" placeholder="username" autocomplete="off" spellcheck="false">
    <button id="go" onclick="lookup()">Search</button>
  </div>
  <div id="msg"></div>
  <div id="result"></div>
</div>

<footer>Built with <span>♥</span> · HCF</footer>

<script>
const q   = document.getElementById('q');
const btn = document.getElementById('go');
const msg = document.getElementById('msg');
const res = document.getElementById('result');

q.addEventListener('keydown', e => { if(e.key==='Enter') lookup(); });

function fmt(n){
  n=parseInt(n)||0;
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copy(txt, el){
  navigator.clipboard.writeText(txt).then(()=>{
    el.textContent='Copied!';
    setTimeout(()=>el.textContent='Copy',1500);
  });
}

async function lookup(){
  const username = q.value.trim().replace(/^@/,'');
  if(!username){ setMsg('Enter a username.','err'); return; }

  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>Searching';
  setMsg('Fetching...');
  res.style.display='none';

  try{
    const r = await fetch(`/api/lookup?username=${encodeURIComponent(username)}`);
    const d = await r.json();

    if(!d.success){ setMsg('⚠ '+(d.error||'Not found'),'err'); return; }

    setMsg('');
    render(d);
  } catch(e){
    setMsg('⚠ Request failed.','err');
  } finally {
    btn.disabled=false;
    btn.textContent='Search';
  }
}

function setMsg(text, cls=''){
  msg.textContent=text;
  msg.className=cls;
}

function render(d){
  const av = d.avatar
    ? `<img src="${esc(d.avatar)}" alt="av" onerror="this.parentElement.innerHTML='<div class=av-fb>${esc((d.name||d.username||'?')[0].toUpperCase())}</div>'">`
    : `<div class="av-fb">${esc((d.name||d.username||'?')[0].toUpperCase())}</div>`;

  const lock = d.private ? `<div class="lock">🔒</div>` : '';
  const bio  = d.bio ? `<div class="bio">${esc(d.bio)}</div>` : '';

  const rows = [
    { k:'Country',  v: d.country },
    { k:'Status',   v: d.private ? '🔒 Private' : '🌐 Public' },
    { k:'Created',  v: d.created || '—' },
    { k:'User ID',  v: d.id,     cp: d.id },
    { k:'Sec UID',  v: d.secuid ? d.secuid.slice(0,26)+'…' : '—', cp: d.secuid },
  ];

  const rowsHtml = rows.map((r,i)=>`
    <div class="row">
      <span class="rk">${r.k}</span>
      <span class="rv">${esc(r.v)}</span>
      ${r.cp ? `<button class="cp" onclick="copy('${r.cp.replace(/'/g,"\\'")}',this)">Copy</button>` : ''}
    </div>`).join('');

  res.innerHTML = `
    <div class="card">
      <div class="profile-top">
        <div class="av">${av}${lock}</div>
        <div class="pname">
          <div class="dn">${esc(d.name||d.username)}</div>
          <div class="handle">@${esc(d.username)}</div>
          <a class="open-btn" href="https://tiktok.com/@${encodeURIComponent(d.username)}" target="_blank" rel="noopener">↗ Open Profile</a>
        </div>
      </div>
      ${bio}
    </div>

    <div class="stats">
      <div class="stat"><div class="v">${fmt(d.followers)}</div><div class="l">Followers</div></div>
      <div class="stat"><div class="v">${fmt(d.following)}</div><div class="l">Following</div></div>
      <div class="stat"><div class="v">${fmt(d.likes)}</div><div class="l">Likes</div></div>
      <div class="stat"><div class="v">${fmt(d.videos)}</div><div class="l">Videos</div></div>
    </div>

    <div class="info-list">${rowsHtml}</div>
  `;
  res.style.display='block';
  res.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
